/* Fonte de Navegador do OBS: 360×281, fundo transparente (o card ameixa vem do PNG da overlay) */
:root{--fg:#3A301C;--lbl:#7A6A4F;--sub:#8A5E06;--muted:#7A6A4F;--hi:#3E8A5C;--line:#F6E7B4;--warn:#A6612A}
*{box-sizing:border-box;margin:0}
html,body{width:360px;height:281px;overflow:hidden;background:transparent;font-family:N,system-ui,sans-serif;color:var(--fg)}
.wrap{padding:14px 16px 0;height:100%;display:flex;flex-direction:column}
.lbl{font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--lbl);line-height:18px}
.ttl{font-weight:800;font-size:19px;line-height:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub.lucky{color:var(--hi);font-weight:800}
.sub{font-weight:600;font-size:13px;line-height:18px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd{min-height:66px}
.div{height:2px;background:var(--line);margin:6px 0 4px}
.list{position:relative;flex:1}
.row{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:center;height:36px;padding:0 6px;margin:0 -6px;border-radius:10px;transition:height .45s ease .35s,opacity .45s ease .35s,background .3s;overflow:hidden}
.row .ic{width:32px;height:32px;display:grid;place-items:center}
.row .ic img{width:32px;height:32px;object-fit:contain}
.row .ic svg{width:22px;height:22px}
.row .tx{min-width:0;line-height:1.1}
.row b{display:block;font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{display:block;font-weight:600;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.row.here{background:rgba(62,138,92,.14);box-shadow:inset 3px 0 0 var(--hi)}
.row.warn b{color:var(--warn)}
.row.mk b{color:var(--sub)}
.row.new{animation:in .5s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.row.done{height:0;opacity:0}
.row.done .ic{animation:pop .35s ease both}
.row.done b{text-decoration:line-through;text-decoration-thickness:2px}
@keyframes pop{50%{transform:scale(1.25)}}
.check{width:26px;height:26px;border-radius:50%;background:var(--hi);display:grid;place-items:center}
.cnt{color:var(--sub)}

const $=id=>document.getElementById(id),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rows=new Map();
function icon(t){if(t.type==='mk')return ICON.mk;if(t.type==='item')return ICON.item;if(t.type==='warn')return ICON.warn;
  const s=SP[t.sp];return s?'<img alt="" src="data:image/png;base64,'+s+'">':ICON.item}
function rowHtml(t){return '<span class="ic">'+icon(t)+'</span><span class="tx"><b>'+esc(t.text)+'</b>'+(t.sub?'<small>'+esc(t.sub)+'</small>':'')+'</span>'}
function render(d){
  if(d.sprites)SP=Object.assign({},SP,d.sprites);
  const L=d.local;$('hs').classList.remove('lucky');
  if(L){$('hl').textContent='Você está em';$('ht').textContent=L.nome;
    const outros=(L.aqui||[]);$('hs').classList.toggle('lucky',!!L.sortuda);$('hs').textContent=L.sortuda?L.sortuda:(outros.length?'Aqui: '+outros.join(', '):'Nada pendente aqui')}
  else if(d.cab){$('hl').textContent=d.cab.save+(d.cab.parte?' · Parte '+d.cab.parte:'');$('ht').textContent=d.cab.titulo;$('hs').textContent=d.cab.sub||''}
  let all=(d.tarefas||[]).slice();
  if(L){const here=all.filter(t=>t.place&&t.place.split(' (')[0]===L.base);all=here.concat(all.filter(t=>!here.includes(t)))} // no lugar: tarefas daqui primeiro
  const want=all.slice(0,MAXROWS);if(d.marco)want.push({k:'__mk__'+d.marco,type:'mk',text:d.marco,sub:'Marco da parte'});
  const keep=new Set(want.map(t=>t.k)),list=$('list');
  for(const [k,el] of rows){if(!keep.has(k)&&!el.classList.contains('done')){el.classList.add('done');el.querySelector('.ic').innerHTML=ICON.ok;setTimeout(()=>{el.remove();rows.delete(k)},900)}}
  let prev=null;
  for(const t of want){let el=rows.get(t.k);
    if(!el||el.classList.contains('done')){el=document.createElement('div');el.className='row new';rows.set(t.k,el)}
    el.className='row'+(el.classList.contains('new')?' new':'')+(t.type==='warn'?' warn':'')+(t.type==='mk'?' mk':'')+(L&&t.place&&t.place.split(' (')[0]===L.base?' here':'');
    const h=rowHtml(t);if(el._h!==h){el.innerHTML=h;el._h=h}
    let anchor=prev?prev.nextSibling:list.firstChild;while(anchor&&anchor!==el&&anchor.classList.contains('done'))anchor=anchor.nextSibling;
    if(anchor!==el)list.insertBefore(el,anchor);
    prev=el}
  setTimeout(()=>rows.forEach(el=>el.classList.remove('new')),600)}
if(demo&&DEMO[demo])render(DEMO[demo]);
